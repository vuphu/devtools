[package]
name = "extension-sdk"
version = "0.1.0"
edition = "2024"
description = "SDK for developing devtools Wasm extensions in Rust"

[lib]
name = "devtools_extension_sdk"

[dependencies]
devtools-core = { package = "core", path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "wasi")'.dependencies]
wit-bindgen = "0.63.0"
